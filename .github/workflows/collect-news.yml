name: Collect raw news

# Recolector: acumula los items del día en Redis (`raw:YYYY-MM-DD`) sin resumir nada.
# Corre seguido porque los feeds son ventanas cortas — The Verge solo expone 10 items (~5 h),
# así que una única pasada diaria no puede ver un día completo.
on:
  schedule:
    # Cada hora, y no es exceso: GitHub no solo retrasa las corridas programadas, las DESCARTA.
    # Midiendo el historial real con `23 */3` (8 pedidas/día) llegaban ~5, con huecos de hasta
    # 7,9 h y 23 de 39 huecos por encima de las ~5 h que dura la ventana de The Verge. Todo item
    # que se cae del feed dentro de un hueco se pierde para siempre: es la causa de que un día
    # llegue flaco al digest. Pidiendo cada hora, incluso descartando la mitad, el hueco efectivo
    # queda muy por debajo de esa ventana.
    #
    # Coste en Upstash: ~15 comandos por corrida × 24 = ~360/día ≈ 11 k/mes, ~2 % del medio millón
    # mensual del plan gratuito. La preocupación de cuota que fijó las 3 h era infundada.
    # Minuto 23 a propósito: el minuto :00 es el más congestionado de GitHub Actions.
    - cron: "23 * * * *"
  workflow_dispatch:

# Si un run se retrasa y se solapa con el siguiente, no hace falta acumular dos veces.
concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run collect
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
