name: Daily news pipeline

# Digest: toma el día ya cerrado (siempre "ayer" en ET) desde lo que acumuló el recolector,
# lo resume con Gemini y lo guarda en `news:YYYY-MM-DD`.
on:
  schedule:
    # 08:47 UTC ≈ 04:47 ET. El día objetivo se calcula desde la FECHA ET, no restando horas,
    # así que cualquier hora del mismo día ET da el mismo resultado: hay ~19 h de margen antes
    # de que un retraso de GitHub pudiera mover el objetivo. Minuto 47 para esquivar la cola
    # del minuto :00, que es donde se acumulan los retrasos de horas.
    - cron: "47 8 * * *"
  workflow_dispatch:

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
